apiVersion: v1
kind: Service
metadata:
  # keep this name "backend" — the frontend targets http://backend:8000 in both
  # compose and k8s
  name: backend
  namespace: forecasting
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
