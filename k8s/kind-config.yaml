# single-node cluster; maps port 80 so ingress-nginx is reachable on the host
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ts-forecast
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
